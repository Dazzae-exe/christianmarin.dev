# Continous Integration Workflow

on:
  pull_request:
    types: [opened, reopened]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Preparar pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          install: false

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Linting
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
