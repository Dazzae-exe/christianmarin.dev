# Continous Integration Workflow

# working-directories puede ser usado dentro de jobs en steps para cambiar el directorio de trabajo. Esto es útil si tu proyecto tiene un monorepo o si quieres ejecutar comandos en un subdirectorio específico.

on:
  pull_request:
    types: [opened, reopened]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-22.04

    # tambien existen los defaults a nivel de workflow, pero no se pueden sobreescribir a nivel de job
    # defaults:
    # run:
    # working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Preparar pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          install: false

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Linting
        run: pnpm lint

      - name: Build
        run: pnpm build
